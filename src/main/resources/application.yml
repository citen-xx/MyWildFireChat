spring:
  application:
    name: my-wildfire-chat
  datasource:
    url: jdbc:mysql://localhost:3307/im_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${IM_MYSQL_USERNAME:root}
    password: ${IM_MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:db/schema.sql,classpath:db/schema-mysql-migrate.sql
      data-locations: classpath:db/data.sql
  data:
    redis:
      host: ${IM_REDIS_HOST:localhost}
      port: ${IM_REDIS_PORT:6380}
      password: ${IM_REDIS_PASSWORD:}
  rabbitmq:
    host: ${IM_RABBITMQ_HOST:localhost}
    port: ${IM_RABBITMQ_PORT:5672}
    username: ${IM_RABBITMQ_USERNAME:im}
    password: ${IM_RABBITMQ_PASSWORD:im}

server:
  port: ${IM_HTTP_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml

im:
  server:
    id: ${IM_SERVER_ID:im-server-1}
    heartbeat-interval-seconds: ${IM_SERVER_HEARTBEAT_INTERVAL_SECONDS:10}
    offline-timeout-seconds: ${IM_SERVER_OFFLINE_TIMEOUT_SECONDS:30}
    route-ttl-seconds: ${IM_ROUTE_TTL_SECONDS:60}
  route:
    redis-enabled: true
  mq:
    enabled: ${IM_MQ_ENABLED:true}
    exchange: ${IM_MQ_EXCHANGE:im.message.relay}
    queue-prefix: ${IM_MQ_QUEUE_PREFIX:im.message.relay.}
    delivery-dedup-ttl-seconds: ${IM_MQ_DELIVERY_DEDUP_TTL_SECONDS:30}
  jwt:
    issuer: my-wildfire-chat
    secret: ${IM_JWT_SECRET:change-this-development-secret-change-this-development-secret}
    ttl-seconds: 7200
  netty:
    host: ${IM_NETTY_HOST:0.0.0.0}
    port: ${IM_NETTY_PORT:9000}
    boss-threads: 1
    worker-threads: 0
    max-frame-length: 1048576
    reader-idle-seconds: 60
    keep-alive: true
  ack:
    redis-enabled: true
    retry-enabled: true
    retry-delays-millis: 3000,3000,5000
    scan-interval-millis: 1000
    scan-limit: 100
