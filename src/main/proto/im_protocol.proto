syntax = "proto3";

package com.example.im.protocol;

option java_package = "com.example.im.netty.protocol";
option java_outer_classname = "ImProtocol";
option java_multiple_files = false;

message MessageEnvelope {
  enum MessageType {
    MESSAGE_TYPE_UNSPECIFIED = 0;
    CONNECT = 1;
    CONNECT_ACK = 2;
    PING = 3;
    PONG = 4;
    SEND_MESSAGE = 5;
    MESSAGE_ACK = 6;
    SYNC_REQUEST = 7;
    SYNC_RESPONSE = 8;
    ERROR = 9;
    PUSH_MESSAGE = 10;
    SEND_RESULT = 11;
    SYNC_COMPLETE = 12;
  }

  MessageType message_type = 1;
  string request_id = 2;
  int64 timestamp = 3;
  bytes payload = 4;
}

message ConnectRequest {
  string token = 1;
  string device_id = 2;
}

message ConnectAck {
  int64 user_id = 1;
  string device_id = 2;
  int64 server_time = 3;
}

message ErrorPayload {
  string code = 1;
  string message = 2;
}

message SendMessageRequest {
  string client_message_id = 1;
  int64 receiver_id = 2;
  string content = 3;
  string message_type = 4;
}

message SendResult {
  string client_message_id = 1;
  string message_id = 2;
  int64 conversation_id = 3;
  int64 sequence = 4;
  int64 created_at = 5;
}

message PushMessage {
  string message_id = 1;
  string client_message_id = 2;
  int64 conversation_id = 3;
  int64 sequence = 4;
  int64 sender_id = 5;
  int64 receiver_id = 6;
  string content = 7;
  string message_type = 8;
  int64 created_at = 9;
}

message MessageAck {
  string message_id = 1;
  int64 conversation_id = 2;
  int64 sequence = 3;
}

message SyncRequest {
  int64 conversation_id = 1;
  int64 last_sequence = 2;
  optional int32 limit = 3;
}

message SyncResponse {
  int64 conversation_id = 1;
  repeated PushMessage messages = 2;
  bool has_more = 3;
  int64 next_sequence = 4;
}

message SyncComplete {
  int64 conversation_id = 1;
  int64 next_sequence = 2;
}
